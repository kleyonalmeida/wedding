services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      # Dados persistidos em volume nomeado — sobrevive ao docker compose down
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Não expõe porta ao host em produção — apenas a API acessa o banco
    # Em desenvolvimento, descomente a linha abaixo para acesso externo:
    # ports:
    #   - "5432:5432"

  # ── API .NET 8 ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        # Aguarda o PostgreSQL estar pronto ANTES de iniciar a API
        condition: service_healthy
    environment:
      # Connection string monta dinamicamente a partir das variáveis do .env
      ConnectionStrings__DefaultConnection: >-
        Host=db;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};
        Pooling=true;Minimum Pool Size=1;Maximum Pool Size=10;Command Timeout=30
      AllowedOrigin:        ${ALLOWED_ORIGIN}
      Jwt__Secret:          ${JWT_SECRET}
      Jwt__Issuer:          ${JWT_ISSUER:-wedding-rsvp-api}
      Admin__Username:      ${ADMIN_USERNAME}
      Admin__PasswordHash:  ${ADMIN_PASSWORD_HASH}
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      # Nginx externo faz proxy para esta porta
      # Nginx: proxy_pass http://localhost:5000;
      - "5000:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
    driver: local
