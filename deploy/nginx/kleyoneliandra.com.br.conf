server {
    listen 80;
    listen [::]:80;

    server_name kleyoneliandra.com.br www.kleyoneliandra.com.br;

    return 301 https://kleyoneliandra.com.br$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name kleyoneliandra.com.br;

    ssl_certificate /etc/letsencrypt/live/kleyoneliandra.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kleyoneliandra.com.br/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name www.kleyoneliandra.com.br;

    ssl_certificate /etc/letsencrypt/live/kleyoneliandra.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kleyoneliandra.com.br/privkey.pem;

    return 301 https://kleyoneliandra.com.br$request_uri;
}
