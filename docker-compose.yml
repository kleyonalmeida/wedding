services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ── API .NET 8 ─────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      SUPERADMIN_EMAIL: "${SUPERADMIN_EMAIL:?Set SUPERADMIN_EMAIL}"
      SUPERADMIN_INITIAL_PASSWORD: "${SUPERADMIN_INITIAL_PASSWORD:-}"
      Asaas__ApiKey: "${ASAAS_API_KEY:?Set ASAAS_API_KEY}"
      Asaas__WebhookAuthToken: "${ASAAS_WEBHOOK_AUTH_TOKEN:?Set ASAAS_WEBHOOK_AUTH_TOKEN}"
      Asaas__Environment: "${ASAAS_ENVIRONMENT:-Sandbox}"
      PublicBaseUrl: "${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL}"
      GiftImagePath: /data/gift-images
      DataProtectionKeyPath: /data/keys
      AllowedOrigin: "${ALLOWED_ORIGIN}"
    volumes:
      - gift_images:/data/gift-images
      - protection_keys:/data/keys
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Frontend (Flutter Web + Nginx Containerizado) ────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"

volumes:
  postgres_data:
    driver: local
  gift_images:
    driver: local
  protection_keys:
    driver: local
